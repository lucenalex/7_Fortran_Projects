name: Diagnose byte-preserving Fortran normalization
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-legacy.yml
      - tools/normalize_fortran_tabs_bytes.py
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply to clean checkout and check exact changes
        run: |
          python3 tools/normalize_fortran_tabs_bytes.py
          python3 tools/normalize_fortran_tabs_bytes.py --apply
          git diff --check
          git diff --stat
          echo "changed files: $(git diff --name-only | wc -l)"
          test $(git diff --name-only | wc -l) -eq 23
          bash tools/check_sources.sh "$RUNNER_TEMP/legacy-check"
